<html>
<head>
    <style>
        body {
            margin:0;
            padding:0;
            overflow:hidden;
            background:transparent;
            display:flex;
            justify-content: center;
            align-items: center;
            height:100vh;
        }

        @keyframes jump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-40px); }
            }

        .sprite-container {
            width:100px;
            height:200px;
            position:relative;
            overflow:hidden;
        }

        img {
            position: absolute;
            width: 100%;
            top:50px;
            animation: jump 1s infinite cubic-bezier(0.25, 1, 0.5, 1);
        }

        #jump_counter {
            position:absolute;
            width:100%;
            bottom: 20px;
            color:#ffffff;
            background-color:#000000;
            text-align:center;
        }
    </style>
</head> <!-- no title needed cos we hide everything-->
<body>
<div class="sprite-container">
    <img src="smiley.png" alt="smiley face">
    <p id="jump_counter">Jumps: 0</p>
</div>

<script>
    const text=document.getElementById('jump_counter')
    let jumps = 0
    setInterval(() => {
        jumps++;
        text.innerHTML = 'Jumps: '+ jumps;
    }, 1000)
</script>

</body>
</html>
