<html>
<head>
    <style>
        body {
            margin:0;
            padding:0;
            overflow:hidden;
            background:transparent;
            display:flex;
            justify-content: center;
            align-items: center;
            height:100vh;
        }

        .sprite-container {
            width:200px;
            height:250px;
            position:relative;
            overflow:hidden;
        }

        img {
            position: absolute;
            width: 100%;
        }

        #jump_counter {
            position:absolute;
            width:100%;
            bottom: 8px;
            color:#ffffff;
            background-color:#000000;
            text-align:center;
        }
    </style>
</head> <!-- no title needed cos we hide everything-->
<body>
<div class="sprite-container">
    <img src="smiley.png" alt="smiley face">
    <p id="jump_counter">Jumps: </p>
</div>

<script>
    const text=document.getElementById('jump_counter')
    let jumps = 0
    setInterval(() => {
        jumps++;
        text.innerHTML = 'Jumps: '+ jumps;
    })
</script>

</body>
</html>
